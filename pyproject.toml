[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opentape-archive-manager"
version = "0.5.4"
description = "Safety-first open tape archive orchestration (simulator preview)"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
web = ["fastapi==0.143.3", "uvicorn==0.54.0", "httpx==0.28.1"]

[tool.setuptools.package-data]
"otam.web" = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[project.scripts]
otam = "otam.cli:main"

[tool.setuptools.packages.find]
include = ["otam*"]
