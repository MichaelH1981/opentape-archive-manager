# Optional worker-only drop-in. Web service retains PrivateDevices=true.
# Install as /etc/systemd/system/otam-worker.service.d/physical.conf
# Requires the dedicated otam-tape group and tape-only udev rules.
[Service]
PrivateDevices=false
DevicePolicy=closed
DeviceAllow=char-st rw
DeviceAllow=char-sg rw
SupplementaryGroups=otam-tape
